image: php:8.3-cli

variables:
  DB_USER: runner
  DB_PASSWORD: password
  DB_HOST: mysql
  DB_PORT: 3306
  DB_NAME: phpunit
  DATABASE_URL: "mysql://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}?serverVersion=8.0.32&charset=utf8mb4"

services:
  - name: mysql:8.0
    alias: mysql
    variables:
      MYSQL_USER: $DB_USER
      MYSQL_PASSWORD: $DB_PASSWORD
      MYSQL_DATABASE: $DB_NAME
      MYSQL_ROOT_PASSWORD: root

stages:
  - build
  - test
  - push
  - deploy

cache:
  paths:
    - vendor/
    - ~/.composer/cache

before_script:
    - apt-get update && apt-get install -y curl git unzip zip libzip-dev zlib1g-dev default-mysql-client
    - docker-php-ext-install zip pdo pdo_mysql
    - pecl install xdebug && docker-php-ext-enable xdebug
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
    - php -m | grep -E 'xml|mbstring'
    - apt-get install -y lftp

    - mysql -h "$DB_HOST" -u root -proot -e "DROP USER IF EXISTS '$DB_USER'@'%';"
    - mysql -h "$DB_HOST" -u root -proot -e "CREATE USER '$DB_USER'@'%' IDENTIFIED BY '$DB_PASSWORD';"
    - mysql -h "$DB_HOST" -u root -proot -e "GRANT ALL PRIVILEGES ON *.* TO '$DB_USER'@'%';"
    - mysql -h "$DB_HOST" -u root -proot -e "FLUSH PRIVILEGES;"

    - composer install --prefer-dist --no-progress --no-suggest --no-interaction

    - php bin/console doctrine:database:create --env=test
    - php bin/console doctrine:migrations:migrate --no-interaction --env=test

    - php -S 127.0.0.1:8000 -t public > server.log 2>&1 &
    - until curl -s http://127.0.0.1:8000; do echo "Waiting for Symfony server..."; sleep 5; done

build:
  stage: build
  script:
    - echo "Build en cours..."
  when: on_success
  artifacts:
    paths:
      - vendor/
      - var/

test:
  stage: test
  variables:
    XDEBUG_MODE: coverage
  needs:
    - job: build
      artifacts: true
  script:
    - echo "Test en cours..."
    - composer grumphp
  when: on_success
  only:
    - dev

push:
  stage: push
  script:
    - echo "Push en cours..."
    - git config --global user.name "CI-CD Robot"
    - git config --global user.email "robot.gertrude@gmail.com"
    - git push -v -u --force "https://gitlab-ci-token:${CICD_ROBOT}@gitlab.com/Solaki/php_unit.git" HEAD:refs/heads/preprod
  when: on_success
  only:
    - dev

deploy:
  stage: deploy
  script:
    - echo "Deploy en cours..."
    - git clone --depth 1 --branch preprod $CI_REPOSITORY_URL main
    - cd main
    - git clean -fdx
    - rm -rf .git .gitignore .gitlab-ci.yml README.md
    - lftp -c "set sftp:auto-confirm yes; open -u $SFTP_USER $SFTP_PASSWORD sftp://$SFTP_HOST:$SFTP_PORT; mirror --delete --verbose --reverse ./ /www/"
  when: manual
  only:
    - preprod